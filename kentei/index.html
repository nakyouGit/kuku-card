<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>九九けんてい</title>
<link rel="stylesheet" href="game.css">
</head>
<body>
<main id="app">

  <!-- はじめの画面 -->
  <section id="titleScreen" class="screen">
    <h1 class="title">九九けんてい</h1>
    <p class="lead">しきが つぎつぎ でるよ。こえに だして よもう！</p>

    <h2 class="label">だんを えらんでね</h2>
    <div id="danButtons" class="dan-grid"></div>

    <h2 class="label">じゅんばんを えらんでね</h2>
    <div id="modeButtons" class="mode-row"></div>

    <label class="hint-toggle"><input type="checkbox" id="hintToggle"> よみかたも だす</label>

    <button type="button" id="startButton" class="big-button">スタート</button>
  </section>

  <!-- あそぶ画面 -->
  <section id="playScreen" class="screen" hidden>
    <div class="play-head">
      <span id="playTitle"></span>
      <button type="button" id="quitButton" class="small-button">やめる</button>
    </div>
    <div id="progress" class="progress"></div>
    <div id="card" class="card">
      <div id="cardMain" class="card-main"></div>
      <div id="cardSub" class="card-sub"></div>
    </div>
    <div class="timer"><div id="timerBar" class="timer-bar"></div></div>
  </section>

  <!-- 先生が止めている時の画面 -->
  <section id="stoppedScreen" class="screen" hidden>
    <h1 class="result-title">いまは おやすみ だよ</h1>
    <p id="stoppedMessage" class="lead" hidden></p>
    <p class="status">せんせいが また はじめるまで まってね</p>
  </section>

  <!-- おわりの画面 -->
  <section id="resultScreen" class="screen" hidden>
    <h1 class="result-title pass">おわり！</h1>
    <p class="result-score">ぜんぶ よめたかな？ こたえあわせを しよう</p>
    <ul id="resultList" class="result-list"></ul>
    <div class="result-buttons">
      <button type="button" id="retryButton" class="big-button">もういちど</button>
      <button type="button" id="backButton" class="big-button sub">だんを えらぶ</button>
    </div>
  </section>

</main>

<script src="kuku-readings.js"></script>
<script src="game-config.js"></script>
<script src="game-questions.js"></script>
<script src="game-main.js"></script>
<script type="module" src="game-stop.js"></script>
</body>
</html>
